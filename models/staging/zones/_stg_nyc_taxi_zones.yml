version: 2

models:
  - name: stg_nyc_taxi_zones
    description: This model cleans column names from Raw Taxi Zone dimension table
    columns:
          - name: location_id
            data_type: bigint
            description: Primary key. Key representing a specific TLC taxi zone. Maps directly to `PULocationID` (Pickup) and `DOLocationID` (Dropoff) in source trip fact tables.

          - name: borough
            data_type: varchar
            description: The administrative district of New York City where the taxi zone is situated

          - name: zone
            data_type: varchar
            description: The human-readable name of the specific neighborhood or geographic area designated as a TLC taxi zone.

          - name: service_zone
            data_type: varchar
            description: The regulatory service classification designated by the TLC. Indicates operational restrictions and vehicle licensing zones.