version: 2

models:
  - name: stg_nyc_taxi_trips
    description: This model cleans column names from Raw Taxi Trips fact table.
    columns:
      - name: trip_id
        data_type: varchar
        description: >
          Surrogate key generated via MD5 hashing based on vendor_id, meter_on, meter_off, meter_on_zone_id, meter_off_zone_id, and total_amount. Introduced to ensure unique record identification and handle data duplication issues in the source files.
        tests:
          - not_null

      - name: vendor_id
        data_type: integer
        description: >
          "{{ doc('vendorid') }}"

      - name: meter_on
        data_type: timestamp
        description: >
          The date and time when the meter was engaged.

      - name: meter_off
        data_type: timestamp
        description: >
          The date and time when the meter was disengaged

      - name: passenger_count
        data_type: bigint
        description: >
          The number of passengers in the vehicle. 

      - name: trip_distance
        data_type: double
        description: >
          The elapsed trip distance in miles reported by the taximeter. 

      - name: rate_code_id
        data_type: bigint
        description: >
          "{{ doc('ratecodeid') }}"

      - name: stored_flag
        data_type: varchar
        description: >
          "{{ doc('store_and_fwd_flag') }}"

      - name: meter_on_zone_id
        data_type: integer
        description: >
          TLC Taxi Zone in which the taximeter was engaged.

      - name: meter_off_zone_id
        data_type: integer
        description: >
          TLC Taxi Zone in which the taximeter was disengaged.

      - name: payment_type
        data_type: bigint
        description: >
          "{{ doc('payment_type') }}"

      - name: fare_amount
        data_type: double
        description: >
          The time-and-distance fare calculated by the meter.

      - name: extra_charges
        data_type: double
        description: >
          Miscellaneous extras and surcharges. 

      - name: tax_amount
        data_type: double
        description: >
          Tax that is automatically triggered based on the metered rate in use. 

      - name: tip_amount
        data_type: double
        description: >
          Tip amount – This field is automatically populated for credit card tips. Cash tips are not include.

      - name: tolls_amount
        data_type: double
        description: >
          Total amount of all tolls paid in trip.

      - name: improvement_surcharge
        data_type: double
        description: >
          Improvement surcharge assessed trips at the flag drop. The improvement surcharge began being levied in 2015.

      - name: congestion_surcharge
        data_type: double
        description: >
          The total amount charged to passengers. Does not include cash tips

      - name: airport_fee
        data_type: double
        description: >
          For pick up only at LaGuardia and John F. Kennedy Airports.

      - name: cbd_congestion_fee
        data_type: double
        description: >
          Per-trip charge for MTA's Congestion Relief Zone starting 01 Jan 2025.

      - name: total_amount
        data_type: double
        description: >
          The total amount charged to passengers. Does not include cash tips