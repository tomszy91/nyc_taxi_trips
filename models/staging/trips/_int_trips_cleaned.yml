version: 2

models:
  - name: int_trips_cleaned
    description: >
      An intermediate model designed for data cleansing and anomaly enforcement on raw taxi trip records. It filters out system errors and non-physical outliers based on spatial (distance between 0 and 500 miles), temporal (drop-off time must be after pickup time), and velocity (calculated speed lower than 100 mph) thresholds to ensure data quality for downstream reporting.
    columns:
      - name: vendor_id
        data_type: smallint
        description: >
          "{{ doc('vendorid') }}"

      - name: meter_on
        data_type: timestamp
        description: >
          The date and time when the meter was engaged.

      - name: meter_off
        data_type: timestamp
        description: >
          The date and time when the meter was disengaged

      - name: passenger_count
        data_type: smallint
        description: >
          The number of passengers in the vehicle.

      - name: trip_distance
        data_type: decimal(8,2)
        description: >
          The elapsed trip distance in miles reported by the taximeter.

      - name: rate_code_id
        data_type: smallint
        description: >
          "{{ doc('ratecodeid') }}"

      - name: stored_flag
        data_type: varchar
        description: >
          "{{ doc('store_and_fwd_flag') }}"

      - name: meter_on_zone_id
        data_type: smallint
        description: >
          TLC Taxi Zone in which the taximeter was engaged.

      - name: meter_off_zone_id
        data_type: smallint
        description: >
          TLC Taxi Zone in which the taximeter was disengaged.

      - name: payment_type
        data_type: smallint
        description: >
          "{{ doc('payment_type') }}"

      - name: fare_amount
        data_type: decimal(8,2)
        description: >
          The time-and-distance fare calculated by the meter.

      - name: extra_charges
        data_type: decimal(8,2)
        description: >
          Miscellaneous extras and surcharges.

      - name: tax_amount
        data_type: decimal(8,2)
        description: >
          Tax that is automatically triggered based on the metered rate in use.

      - name: tip_amount
        data_type: decimal(8,2)
        description: >
          Tip amount – This field is automatically populated for credit card tips. Cash tips are not include.

      - name: tolls_amount
        data_type: decimal(8,2)
        description: >
          Total amount of all tolls paid in trip.

      - name: improvement_surcharge
        data_type: decimal(8,2)
        description: >
          Improvecharge assessed trips at the flag drop. The improvement surcharge began being levied in 2015.

      - name: total_amount
        data_type: decimal(8,2)
        description: >
          The total amount charged to passengers. Does not include cash tips

      - name: congestion_surcharge
        data_type: decimal(8,2)
        description: >
          The total amount charged to passengers. Does not include cash tips

      - name: airport_fee
        data_type: decimal(8,2)
        description: >
          For pick up only at LaGuardia and John F. Kennedy Airports.

      - name: cbd_congestion_fee
        data_type: decimal(8,2)
        description: >
          Per-trip charge for MTA's Congestion Relief Zone starting 01 Jan 2025.