version: 2

models:
  - name: agg_totals_by_hour
    description: >
      Hourly aggregation of NYC taxi financial metrics and payment discrepancies. 
      Used to analyze intraday patterns, peak pricing hours, and hourly data quality consistency.
    columns:
      - name: report_year_month
        data_type: timestamp
        description: >
          The year and month of the trip derived from the trip start timestamp (meter_on)
        tests:
          - not_null 
      - name: hour
        data_type: bigint
        description: >
          The hour of the day extracted from the trip start timestamp (meter_on). Value ranges from 0 to 23.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 23

      - name: total_fare_amount
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated base fare amount.

      - name: total_extra_charges
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated miscellaneous extras and surcharges (e.g., rush hour or overnight fees).

      - name: total_tax_amount
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated state/local taxes.

      - name: total_tip_amount
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated credit card tips.

      - name: total_tolls_amount
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated toll fees.

      - name: total_improvement_surcharge
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated infrastructure improvement surcharges.

      - name: total_congestion_surcharge
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated congestion surcharges.

      - name: total_airport_fee
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated airport pickup/drop-off fees.

      - name: total_cbd_congestion_fee
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated Central Business District congestion fees.

      - name: total_amount
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated official total amount charged to passengers.

      - name: total_calculated_total_amount
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated total amount recalculated by summing individual cost components.

      - name: total_payment_discrepancy
        data_type: "decimal(38,2)"
        description: >
          Hourly aggregated variance between the official total amount and the recalculated total amount.