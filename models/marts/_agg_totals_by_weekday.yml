version: 2

models:
  - name: agg_totals_by_weekday
    description: >
      Weekly day-of-week aggregation of NYC taxi financial metrics and payment discrepancies. Used to analyze intraday patterns, peak pricing hours, and hourly data quality consistency.
    columns:
      - name: report_year_month
        data_type: timestamp
        description: >
          The year and month of the trip derived from the trip start timestamp (meter_on)
        tests:
          - not_null

      - name: day_of_week
        data_type: bigint
        description: >
          The ISO day of the week extracted from meter_on (1 = Monday, 7 = Sunday).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 7

      - name: total_fare_amount
        data_type: "decimal(38,2)"
        description: >
          Aggregated base fare amount per day of week.

      - name: total_extra_charges
        data_type: "decimal(38,2)"
        description: >
          Aggregated miscellaneous extras and surcharges per day of week.

      - name: total_tax_amount
        data_type: "decimal(38,2)"
        description: >
          Aggregated state/local taxes per day of week.

      - name: total_tip_amount
        data_type: "decimal(38,2)"
        description: >
          Aggregated credit card tips per day of week.

      - name: total_tolls_amount
        data_type: "decimal(38,2)"
        description: >
          Aggregated toll fees paid per day of week.

      - name: total_improvement_surcharge
        data_type: "decimal(38,2)"
        description: >
          Aggregated infrastructure improvement surcharges per day of week.

      - name: total_congestion_surcharge
        data_type: "decimal(38,2)"
        description: >
          Aggregated congestion surcharges per day of week.

      - name: total_airport_fee
        data_type: "decimal(38,2)"
        description: >
          Aggregated airport pickup/drop-off fees per day of week.

      - name: total_cbd_congestion_fee
        data_type: "decimal(38,2)"
        description: >
          Aggregated Central Business District congestion fees per day of week.

      - name: total_amount
        data_type: "decimal(38,2)"
        description: >
          Aggregated official total amount charged to passengers per day of week.

      - name: total_calculated_total_amount
        data_type: "decimal(38,2)"
        description: >
          Aggregated total amount recalculated by summing individual components per day of week.

      - name: total_payment_discrepancy
        data_type: "decimal(38,2)"
        description: >
          Aggregated variance between the official total amount and the recalculated total amount per day of week.
